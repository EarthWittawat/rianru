name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/ci-test-password
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "wget -O /dev/null -q http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-test-password
      # The suite never reaches a real gateway: everything outside the `slow`
      # marker stubs the client. These exist so config validation passes.
      VLLM_URL: http://127.0.0.1:9/v1
      VLLM_MODEL: ci-stub-model
      VLLM_API_KEY: ci-stub-key

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      # sentence-transformers pulls torch, and the default Linux wheel carries
      # the CUDA runtime — gigabytes a runner has no use for. Take the CPU
      # build first so the requirements install finds it already satisfied.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Tests that read the course files or expect an ingested corpus skip
      # themselves here: neither exists on a runner. `slow` is deselected
      # because it calls a real LLM gateway.
      - name: Test
        run: pytest -m "not slow"

  web:
    name: web
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
